services:
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - backend/.env
    volumes:
      - ./backend:/var/www/html
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - backend/.env
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      python:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dt07_homestay}
      MYSQL_USER: ${MYSQL_USER:-dt07_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-root}"]
      interval: 20s
      timeout: 5s
      retries: 10

  python:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    environment:
      DT07_DB_URL: ${DT07_DB_URL:-mysql+pymysql://dt07_app:change-me@mysql:3306/dt07_homestay}
      SERVICE_TOKEN: ${PY_SERVICE_TOKEN:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
