x-laravel-environment: &laravel-environment
  APP_NAME: ${APP_NAME:-DT07 Homestay}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env.docker}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${MYSQL_DATABASE:-dt07_homestay}
  DB_USERNAME: ${MYSQL_USER:-dt07_app}
  DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
  CACHE_DRIVER: file
  FILESYSTEM_DISK: local
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  SESSION_SAME_SITE: lax
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
  MAIL_FROM_NAME: ${APP_NAME:-DT07 Homestay}
  MAIL_NOTIFICATIONS_ENABLED: ${MAIL_NOTIFICATIONS_ENABLED:-false}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  PY_SERVICE_URL: http://python:8001
  PY_SERVICE_TOKEN: ${PY_SERVICE_TOKEN:?Set PY_SERVICE_TOKEN in .env.docker}
  PY_SERVICE_TIMEOUT: 3
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env.docker}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env.docker}
  DEPLOY_DEMO_DATA: ${DEPLOY_DEMO_DATA:-false}
  VNPAY_ENABLED: ${VNPAY_ENABLED:-false}
  VNPAY_PAY_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
  VNPAY_SECRET_KEY: ${VNPAY_SECRET_KEY:-}
  VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
  VNPAY_VERSION: 2.1.0
  VNPAY_COMMAND: pay
  VNPAY_ORDER_TYPE: other

x-laravel-image: &laravel-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: dt07-laravel:local

services:
  init:
    <<: *laravel-image
    environment: *laravel-environment
    command: ["php", "artisan", "dt07:prepare-deployment"]
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      python:
        condition: service_started
    restart: "no"

  app:
    <<: *laravel-image
    environment: *laravel-environment
    volumes:
      - laravel_storage:/var/www/html/storage
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      python:
        condition: service_started

  scheduler:
    <<: *laravel-image
    environment: *laravel-environment
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - laravel_storage:/var/www/html/storage
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: dt07-nginx:local
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - laravel_storage:/var/www/storage:ro
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dt07_homestay}
      MYSQL_USER: ${MYSQL_USER:-dt07_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  python:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    image: dt07-python:local
    environment:
      DT07_DB_HOST: mysql
      DT07_DB_PORT: 3306
      DT07_DB_NAME: ${MYSQL_DATABASE:-dt07_homestay}
      DT07_DB_USER: ${MYSQL_USER:-dt07_app}
      DT07_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
      SERVICE_TOKEN: ${PY_SERVICE_TOKEN:?Set PY_SERVICE_TOKEN in .env.docker}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  laravel_storage:
