# Free Laravel web tier. Bring an external MySQL 8 database.
# Uploaded files are ephemeral on this free tier; see docs/RENDER_DEPLOYMENT.md.
services:
  - type: web
    name: dt07-homestay
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./docker/render/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: PORT
        value: "8080"
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DEPLOY_DEMO_DATA
        value: "false"
      - key: MAIL_MAILER
        value: log
      - key: PY_SERVICE_URL
        sync: false
      - key: PY_SERVICE_TOKEN
        sync: false
  - type: web
    name: dt07-python
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./docker/python/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DT07_DB_URL
        sync: false
      - key: SERVICE_TOKEN
        sync: false
