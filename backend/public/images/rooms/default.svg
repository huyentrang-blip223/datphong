<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#e8ded1"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b68352"/>
      <stop offset="100%" stop-color="#8a5e35"/>
    </linearGradient>
    <linearGradient id="bedSheet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede9e3"/>
    </linearGradient>
    <linearGradient id="blanket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12605a"/>
      <stop offset="100%" stop-color="#0b4742"/>
    </linearGradient>
    <linearGradient id="windowView" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8dcd4"/>
      <stop offset="70%" stop-color="#d4ede7"/>
      <stop offset="100%" stop-color="#569c84"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="100%" stop-color="#ffd56b"/>
    </linearGradient>
  </defs>

  <!-- Tường phòng -->
  <rect width="800" height="340" fill="url(#wall)"/>
  <!-- Vách ốp gỗ trang trí đầu giường -->
  <rect x="180" y="80" width="440" height="260" fill="#ccab89" opacity="0.35"/>
  <line x1="260" y1="80" x2="260" y2="340" stroke="#b08b65" stroke-width="1.5" opacity="0.4"/>
  <line x1="340" y1="80" x2="340" y2="340" stroke="#b08b65" stroke-width="1.5" opacity="0.4"/>
  <line x1="460" y1="80" x2="460" y2="340" stroke="#b08b65" stroke-width="1.5" opacity="0.4"/>
  <line x1="540" y1="80" x2="540" y2="340" stroke="#b08b65" stroke-width="1.5" opacity="0.4"/>

  <!-- Sàn gỗ tự nhiên -->
  <rect y="340" width="800" height="160" fill="url(#floor)"/>
  <line x1="0" y1="375" x2="800" y2="375" stroke="#754e2a" stroke-width="2"/>
  <line x1="0" y1="415" x2="800" y2="415" stroke="#754e2a" stroke-width="2"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#754e2a" stroke-width="2"/>

  <!-- Thảm trải sàn thổ cẩm bản địa -->
  <ellipse cx="400" cy="425" rx="260" ry="55" fill="#fcf6ec" stroke="#c56a2c" stroke-width="2.5"/>
  <ellipse cx="400" cy="425" rx="230" ry="42" fill="none" stroke="#12605a" stroke-dasharray="8 6" stroke-width="2"/>

  <!-- Cửa sổ lớn view thiên nhiên bên trái -->
  <rect x="50" y="60" width="100" height="200" rx="4" fill="#5c4028"/>
  <rect x="56" y="66" width="88" height="188" rx="2" fill="url(#windowView)"/>
  <circle cx="100" cy="180" r="45" fill="#2d6e56" opacity="0.8"/>
  <line x1="100" y1="66" x2="100" y2="254" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
  <line x1="56" y1="160" x2="144" y2="160" stroke="#ffffff" stroke-width="3" opacity="0.9"/>

  <!-- Rèm cửa mềm mại -->
  <path d="M40 50 Q60 160 45 280 L30 280 L30 50 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M160 50 Q140 160 155 280 L170 280 L170 50 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Tranh treo tường phong cảnh -->
  <rect x="670" y="90" width="90" height="110" rx="3" fill="#694a30"/>
  <rect x="676" y="96" width="78" height="98" fill="#e2f0ec"/>
  <path d="M676 170 Q715 130 754 150 L754 194 L676 194 Z" fill="#12605a"/>
  <circle cx="700" cy="125" r="10" fill="#ffd166"/>

  <!-- Tab đầu giường bên trái -->
  <rect x="180" y="270" width="55" height="75" rx="3" fill="#80542e"/>
  <rect x="185" y="280" width="45" height="25" rx="2" fill="#664122"/>
  <circle cx="207" cy="292" r="3" fill="#dfbe9f"/>
  <!-- Đèn ngủ trái -->
  <polygon points="195,270 203,230 213,230 221,270" fill="url(#lampGlow)"/>
  <rect x="206" y="270" width="4" height="15" fill="#caa47f"/>

  <!-- Tab đầu giường bên phải -->
  <rect x="565" y="270" width="55" height="75" rx="3" fill="#80542e"/>
  <rect x="570" y="280" width="45" height="25" rx="2" fill="#664122"/>
  <circle cx="592" cy="292" r="3" fill="#dfbe9f"/>
  <!-- Đèn ngủ phải -->
  <polygon points="580,270 588,230 598,230 606,270" fill="url(#lampGlow)"/>
  <rect x="591" y="270" width="4" height="15" fill="#caa47f"/>

  <!-- GIƯỜNG NGỦ CHÍNH (Đẳng cấp & Êm ái) -->
  <!-- Khung đầu giường gỗ -->
  <rect x="245" y="190" width="310" height="100" rx="8" fill="#6e4524"/>
  <rect x="255" y="200" width="290" height="80" rx="5" fill="#8f5d34"/>

  <!-- Gối ngủ êm ái -->
  <rect x="270" y="240" width="115" height="50" rx="10" fill="#ffffff" stroke="#ddd3c5" stroke-width="2"/>
  <rect x="415" y="240" width="115" height="50" rx="10" fill="#ffffff" stroke="#ddd3c5" stroke-width="2"/>
  <!-- Gối tựa trang trí họa tiết bản địa -->
  <rect x="300" y="260" width="60" height="40" rx="6" fill="#c56a2c"/>
  <rect x="440" y="260" width="60" height="40" rx="6" fill="#12605a"/>

  <!-- Nệm giường -->
  <rect x="235" y="285" width="330" height="85" rx="12" fill="url(#bedSheet)"/>
  <path d="M235 340 L565 340 L565 370 L235 370 Z" fill="#cfc5b8"/>

  <!-- Chăn đắp thổ cẩm sang trọng -->
  <rect x="235" y="325" width="330" height="95" rx="8" fill="url(#blanket)"/>
  <line x1="235" y1="355" x2="565" y2="355" stroke="#f0b36d" stroke-width="3"/>
  <line x1="235" y1="365" x2="565" y2="365" stroke="#f0b36d" stroke-dasharray="6 4" stroke-width="1.5"/>

  <!-- Chân giường gỗ -->
  <rect x="245" y="420" width="16" height="22" rx="3" fill="#4d2e16"/>
  <rect x="539" y="420" width="16" height="22" rx="3" fill="#4d2e16"/>

  <!-- Huy hiệu Phòng Tiện Nghi -->
  <g transform="translate(30, 30)">
    <rect width="180" height="36" rx="18" fill="rgba(197, 106, 44, 0.9)"/>
    <text x="90" y="23" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">PHÒNG NGHỈ BẢN ĐỊA</text>
  </g>
</svg>
