<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7fc4b8"/>
      <stop offset="60%" stop-color="#bce3dc"/>
      <stop offset="100%" stop-color="#e3f2ee"/>
    </linearGradient>
    <linearGradient id="mountains" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#245848"/>
      <stop offset="100%" stop-color="#12605a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c56a2c"/>
      <stop offset="100%" stop-color="#8a3b12"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfbc96"/>
      <stop offset="100%" stop-color="#ba8d61"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="100%" stop-color="#ffd56b"/>
    </linearGradient>
  </defs>

  <!-- Bầu trời & đồi núi -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <path d="M0 320 Q180 200 360 270 T720 220 L800 250 L800 500 L0 500 Z" fill="#3a7a66" opacity="0.6"/>
  <path d="M0 360 Q220 280 440 330 T800 300 L800 500 L0 500 Z" fill="url(#mountains)"/>
  
  <!-- Thảm cỏ sân vườn -->
  <path d="M0 420 Q350 390 800 420 L800 500 L0 500 Z" fill="#1b463a"/>

  <!-- Ngôi nhà Homestay bản địa -->
  <!-- Thân nhà -->
  <rect x="220" y="240" width="360" height="190" rx="6" fill="url(#wood)"/>
  <line x1="220" y1="285" x2="580" y2="285" stroke="#9e6e44" stroke-width="2"/>
  <line x1="220" y1="330" x2="580" y2="330" stroke="#9e6e44" stroke-width="2"/>
  <line x1="220" y1="375" x2="580" y2="375" stroke="#9e6e44" stroke-width="2"/>

  <!-- Mái nhà dốc truyền thống -->
  <polygon points="180,245 400,140 620,245" fill="url(#roof)"/>
  <polygon points="180,245 400,140 400,150 190,250" fill="#a44e18"/>

  <!-- Cửa chính bằng gỗ -->
  <rect x="360" y="300" width="80" height="130" rx="4" fill="#6e3e1e"/>
  <rect x="370" y="310" width="28" height="50" rx="2" fill="url(#windowGlow)" opacity="0.9"/>
  <rect x="402" y="310" width="28" height="50" rx="2" fill="url(#windowGlow)" opacity="0.9"/>
  <circle cx="430" cy="370" r="3" fill="#ffd166"/>

  <!-- Cửa sổ kính lớn đón nắng -->
  <rect x="250" y="270" width="75" height="75" rx="4" fill="#4d2c14"/>
  <rect x="255" y="275" width="65" height="65" rx="2" fill="url(#windowGlow)"/>
  <line x1="287" y1="275" x2="287" y2="340" stroke="#4d2c14" stroke-width="2"/>
  <line x1="255" y1="307" x2="320" y2="307" stroke="#4d2c14" stroke-width="2"/>

  <!-- Cửa sổ phòng phải -->
  <rect x="475" y="270" width="75" height="75" rx="4" fill="#4d2c14"/>
  <rect x="480" y="275" width="65" height="65" rx="2" fill="url(#windowGlow)"/>
  <line x1="512" y1="275" x2="512" y2="340" stroke="#4d2c14" stroke-width="2"/>
  <line x1="480" y1="307" x2="545" y2="307" stroke="#4d2c14" stroke-width="2"/>

  <!-- Ban công / hiên nhà gỗ -->
  <rect x="200" y="420" width="400" height="20" rx="3" fill="#7a4622"/>
  <rect x="210" y="390" width="8" height="30" fill="#583116"/>
  <rect x="582" y="390" width="8" height="30" fill="#583116"/>
  <line x1="205" y1="395" x2="595" y2="395" stroke="#583116" stroke-width="3"/>

  <!-- Cây cối bản địa xung quanh -->
  <circle cx="150" cy="380" r="45" fill="#205c45"/>
  <circle cx="120" cy="340" r="35" fill="#2d7c5e"/>
  <circle cx="170" cy="330" r="30" fill="#3ea07b"/>
  <rect x="145" y="390" width="12" height="60" fill="#4d2c14"/>

  <circle cx="660" cy="370" r="50" fill="#1b4d3a"/>
  <circle cx="690" cy="330" r="40" fill="#266950"/>
  <circle cx="640" cy="320" r="32" fill="#358c6b"/>
  <rect x="655" y="380" width="14" height="70" fill="#4d2c14"/>

  <!-- Huy hiệu Homestay Bản Địa -->
  <g transform="translate(30, 30)">
    <rect width="180" height="36" rx="18" fill="rgba(18, 96, 90, 0.85)"/>
    <text x="90" y="23" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">HOMESTAY BẢN ĐỊA</text>
  </g>
</svg>
