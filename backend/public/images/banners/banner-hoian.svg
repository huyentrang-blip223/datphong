<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="sky-hoi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1e;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1a1a3e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2a1838;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="river" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a4a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1a30;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="lantern-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#e63500;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#cc2200;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="lantern-yellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffe066;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#ffb700;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="lantern-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff9eca;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff4488;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff9e0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fff0a0;stop-opacity:0.3"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Night sky -->
  <rect width="1200" height="500" fill="url(#sky-hoi)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.7">
    <circle cx="80" cy="40" r="1"/><circle cx="200" cy="20" r="1.2"/><circle cx="350" cy="55" r="0.8"/>
    <circle cx="500" cy="30" r="1"/><circle cx="650" cy="15" r="1.3"/><circle cx="780" cy="45" r="0.9"/>
    <circle cx="920" cy="25" r="1.1"/><circle cx="1050" cy="60" r="0.8"/><circle cx="1150" cy="35" r="1"/>
    <circle cx="130" cy="80" r="0.7"/><circle cx="290" cy="70" r="1"/><circle cx="440" cy="90" r="0.8"/>
    <circle cx="720" cy="75" r="0.9"/><circle cx="870" cy="85" r="0.7"/><circle cx="1100" cy="50" r="1"/>
  </g>

  <!-- Moon -->
  <circle cx="950" cy="70" r="35" fill="url(#moon)" filter="url(#glow)"/>
  <circle cx="950" cy="70" r="35" fill="none" stroke="#fff9e0" stroke-width="1" opacity="0.5"/>

  <!-- Hoi An old town silhouettes - building shapes -->
  <!-- Background buildings -->
  <g fill="#1e0e2e" opacity="0.8">
    <rect x="0" y="220" width="80" height="180"/>
    <rect x="70" y="200" width="60" height="200"/>
    <polygon points="70,200 100,175 130,200"/>
    <rect x="120" y="215" width="90" height="185"/>
    <polygon points="120,215 165,185 210,215"/>
    <rect x="200" y="225" width="70" height="175"/>
    <rect x="260" y="205" width="100" height="195"/>
    <polygon points="260,205 310,178 360,205"/>
    <rect x="350" y="218" width="80" height="182"/>
    <rect x="420" y="200" width="110" height="200"/>
    <polygon points="420,200 475,170 530,200"/>
    <rect x="520" y="210" width="90" height="190"/>
    <rect x="600" y="195" width="100" height="205"/>
    <polygon points="600,195 650,165 700,195"/>
    <rect x="690" y="208" width="80" height="192"/>
    <rect x="760" y="200" width="120" height="200"/>
    <polygon points="760,200 820,168 880,200"/>
    <rect x="870" y="215" width="90" height="185"/>
    <rect x="950" y="200" width="80" height="200"/>
    <rect x="1020" y="210" width="100" height="190"/>
    <polygon points="1020,210 1070,180 1120,210"/>
    <rect x="1110" y="218" width="90" height="182"/>
  </g>

  <!-- Traditional curved rooftops overlay -->
  <path d="M0,200 Q40,170 80,185 Q120,200 160,175 Q200,150 240,168 Q280,185 320,160 Q360,138 400,155 Q440,172 480,148 Q520,125 560,142 Q600,158 640,135 Q680,112 720,130 Q760,148 800,125 Q840,102 880,120 Q920,138 960,115 Q1000,92 1040,110 Q1080,128 1120,105 Q1160,82 1200,100 L1200,230 Q1100,215 1000,225 Q900,235 800,220 Q700,205 600,218 Q500,230 400,215 Q300,200 200,212 Q100,224 0,210 Z" fill="#150a28" opacity="0.9"/>

  <!-- River -->
  <rect x="0" y="370" width="1200" height="130" fill="url(#river)"/>

  <!-- River reflections of lanterns -->
  <ellipse cx="300" cy="400" rx="25" ry="60" fill="#ff6b35" opacity="0.15"/>
  <ellipse cx="550" cy="410" rx="20" ry="55" fill="#ffe066" opacity="0.15"/>
  <ellipse cx="750" cy="395" rx="22" ry="58" fill="#ff9eca" opacity="0.12"/>
  <ellipse cx="950" cy="405" rx="18" ry="52" fill="#ff6b35" opacity="0.13"/>

  <!-- Bridge (Thu Bon river crossing) -->
  <rect x="300" y="355" width="600" height="18" fill="#2a1520" rx="2"/>
  <line x1="300" y1="355" x2="300" y2="380" stroke="#2a1520" stroke-width="4"/>
  <line x1="400" y1="355" x2="400" y2="380" stroke="#2a1520" stroke-width="4"/>
  <line x1="500" y1="355" x2="500" y2="380" stroke="#2a1520" stroke-width="4"/>
  <line x1="600" y1="355" x2="600" y2="380" stroke="#2a1520" stroke-width="4"/>
  <line x1="700" y1="355" x2="700" y2="380" stroke="#2a1520" stroke-width="4"/>
  <line x1="800" y1="355" x2="800" y2="380" stroke="#2a1520" stroke-width="4"/>
  <line x1="900" y1="355" x2="900" y2="380" stroke="#2a1520" stroke-width="4"/>

  <!-- Lantern strings -->
  <path d="M50,150 Q150,130 250,145 Q350,160 450,138 Q550,118 650,135 Q750,152 850,130 Q950,110 1050,128 Q1150,145 1200,135" fill="none" stroke="#4a2a10" stroke-width="1.5" opacity="0.8"/>
  <path d="M0,175 Q120,155 240,170 Q360,185 480,162 Q600,140 720,158 Q840,175 960,152 Q1080,130 1200,148" fill="none" stroke="#4a2a10" stroke-width="1.5" opacity="0.7"/>

  <!-- Lanterns on strings - red -->
  <g filter="url(#glow)">
    <!-- Row 1 lanterns -->
    <ellipse cx="80" cy="158" rx="14" ry="18" fill="#ff4400" opacity="0.95"/>
    <ellipse cx="80" cy="158" rx="14" ry="18" fill="url(#lantern-red)"/>
    <line x1="80" y1="140" x2="80" y2="148" stroke="#ff6600" stroke-width="1"/>
    <line x1="80" y1="168" x2="80" y2="176" stroke="#ff6600" stroke-width="1"/>

    <ellipse cx="195" cy="142" rx="12" ry="16" fill="#ffcc00" opacity="0.95"/>
    <ellipse cx="195" cy="142" rx="12" ry="16" fill="url(#lantern-yellow)"/>

    <ellipse cx="310" cy="155" rx="16" ry="20" fill="#ff3366" opacity="0.9"/>
    <ellipse cx="310" cy="155" rx="16" ry="20" fill="url(#lantern-pink)"/>

    <ellipse cx="430" cy="135" rx="13" ry="17" fill="#ff6600" opacity="0.95"/>
    <ellipse cx="430" cy="135" rx="13" ry="17" fill="url(#lantern-red)"/>

    <ellipse cx="550" cy="125" rx="15" ry="19" fill="#ffdd00" opacity="0.9"/>
    <ellipse cx="550" cy="125" rx="15" ry="19" fill="url(#lantern-yellow)"/>

    <ellipse cx="660" cy="142" rx="12" ry="16" fill="#ff4400" opacity="0.9"/>
    <ellipse cx="780" cy="125" rx="14" ry="18" fill="#ffcc00" opacity="0.95"/>
    <ellipse cx="900" cy="138" rx="13" ry="17" fill="#ff3366" opacity="0.9"/>
    <ellipse cx="1020" cy="120" rx="15" ry="19" fill="#ff6600" opacity="0.95"/>
    <ellipse cx="1130" cy="140" rx="12" ry="16" fill="#ffdd00" opacity="0.9"/>

    <!-- Row 2 lanterns -->
    <ellipse cx="130" cy="180" rx="11" ry="14" fill="#ff3300" opacity="0.9"/>
    <ellipse cx="260" cy="170" rx="13" ry="16" fill="#ffaa00" opacity="0.9"/>
    <ellipse cx="390" cy="162" rx="10" ry="13" fill="#ff3366" opacity="0.85"/>
    <ellipse cx="510" cy="150" rx="12" ry="15" fill="#ff6600" opacity="0.9"/>
    <ellipse cx="640" cy="165" rx="11" ry="14" fill="#ffcc00" opacity="0.9"/>
    <ellipse cx="760" cy="152" rx="13" ry="16" fill="#ff3300" opacity="0.85"/>
    <ellipse cx="890" cy="162" rx="10" ry="13" fill="#ffaa00" opacity="0.9"/>
    <ellipse cx="1000" cy="148" rx="12" ry="15" fill="#ff3366" opacity="0.85"/>
    <ellipse cx="1110" cy="158" rx="11" ry="14" fill="#ff6600" opacity="0.9"/>
  </g>

  <!-- Lantern glow halos -->
  <g opacity="0.15">
    <circle cx="80" cy="158" r="30" fill="#ff6600"/>
    <circle cx="310" cy="155" r="28" fill="#ff3366"/>
    <circle cx="550" cy="125" r="32" fill="#ffcc00"/>
    <circle cx="780" cy="125" r="28" fill="#ffcc00"/>
    <circle cx="1020" cy="120" r="30" fill="#ff6600"/>
  </g>

  <!-- Water shimmer lines -->
  <g stroke="#3a5070" stroke-width="1" opacity="0.4">
    <path d="M0,385 Q200,380 400,388 Q600,395 800,382 Q1000,370 1200,380"/>
    <path d="M0,405 Q200,400 400,408 Q600,415 800,402 Q1000,390 1200,400"/>
    <path d="M0,425 Q200,420 400,428 Q600,435 800,422 Q1000,410 1200,420"/>
    <path d="M0,445 Q200,440 400,448 Q600,455 800,442 Q1000,430 1200,440"/>
  </g>

  <!-- Foreground dark shoreline -->
  <path d="M0,368 Q200,358 400,365 Q600,372 800,360 Q1000,348 1200,358 L1200,380 Q1000,368 800,378 Q600,388 400,378 Q200,368 0,378 Z" fill="#0e0820" opacity="0.9"/>
</svg>
